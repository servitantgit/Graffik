<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Grafik Screensaver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
  }
  body {
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a4e 50%, #0a0e27 100%);
    background-size: 400% 400%;
    animation: bgShift 30s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3vh;
  }
  @keyframes bgShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Zegar */
  .clock {
    font-size: 22vh;
    font-weight: 200;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: 0 0 60px rgba(100,180,255,0.6);
    font-variant-numeric: tabular-nums;
    margin-bottom: 2vh;
  }
  .clock .sep {
    animation: blink 1s infinite;
    opacity: .85;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  .date-info {
    font-size: 4vh;
    color: #88a8d8;
    margin-bottom: 4vh;
    text-align: center;
  }

  /* Aktualna zmiana */
  .current-shift {
    display: flex;
    align-items: center;
    gap: 3vh;
    padding: 3vh 5vh;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.15);
    margin-bottom: 4vh;
  }
  .cs-brigade {
    font-size: 10vh;
    font-weight: bold;
    padding: 1vh 4vh;
    border-radius: 15px;
    line-height: 1;
  }
  .cs-brigade.A { background: #e74c3c; }
  .cs-brigade.B { background: #27ae60; }
  .cs-brigade.C { background: #2980b9; }
  .cs-brigade.D { background: #8e44ad; }

  .cs-shift {
    font-size: 12vh;
    font-weight: bold;
    padding: 1vh 4vh;
    border-radius: 15px;
    line-height: 1;
  }
  .cs-shift.R { background: #f39c12; }
  .cs-shift.P { background: #16a085; }
  .cs-shift.N { background: linear-gradient(135deg, #2980b9, #1a1a3e); }
  .cs-shift.W { background: rgba(255,255,255,0.1); color: #88a8d8; }
  .cs-shift.U { background: linear-gradient(135deg, #ffd700 0%, #ffeb3b 30%, #00bcd4 100%); }

  .cs-labels {
    display: flex;
    flex-direction: column;
    gap: 1vh;
  }
  .cs-labels .cs-time { font-size: 3.5vh; opacity: .8; }
  .cs-labels .cs-name { font-size: 5vh; font-weight: 600; }

  /* Kalendarz miesięczny */
  .mini-cal-wrap {
    background: rgba(255,255,255,0.04);
    padding: 2vh 3vh;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .mini-cal-month {
    text-align: center;
    font-size: 3vh;
    margin-bottom: 1.5vh;
    color: #88a8d8;
    font-weight: 600;
  }
  .mini-cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.4vh;
  }
  .mini-cal .h {
    text-align: center;
    font-size: 1.5vh;
    color: #667;
    padding: 0.5vh;
    font-weight: bold;
  }
  .mini-cal .h.we { color: #ff6b6b; }
  .mini-cal .d {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8vh;
    font-weight: bold;
    border-radius: 4px;
    color: #fff;
    min-height: 3.5vh;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .mini-cal .d.e { background: transparent; }
  .mini-cal .d.dR { background: #f39c12; }
  .mini-cal .d.dP { background: #16a085; }
  .mini-cal .d.dN { background: #2980b9; }
  .mini-cal .d.dW { background: rgba(255,255,255,0.08); color: #88a8d8; text-shadow: none; }
  .mini-cal .d.dU { background: linear-gradient(135deg, #ffd700, #00bcd4); }
  .mini-cal .d.today { outline: 2px solid #f1c40f; outline-offset: -1px; box-shadow: 0 0 15px rgba(241,196,15,0.7); }

  /* Wybór brygady */
  .brigade-picker {
    position: fixed;
    top: 3vh;
    right: 3vh;
    display: flex;
    gap: 1vh;
  }
  .bp-btn {
    width: 5vh;
    height: 5vh;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-weight: bold;
    font-size: 2vh;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    transition: all .2s;
  }
  .bp-btn:hover { opacity: 1; transform: scale(1.15); }
  .bp-btn.active { opacity: 1; box-shadow: 0 0 15px currentColor; }
  .bp-btn.A { background: #e74c3c; }
  .bp-btn.B { background: #27ae60; }
  .bp-btn.C { background: #2980b9; }
  .bp-btn.D { background: #8e44ad; }

  /* Fabryka info */
  .footer {
    position: fixed;
    bottom: 2vh;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 1.5vh;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <div class="brigade-picker">
    <button class="bp-btn A" data-brig="A">A</button>
    <button class="bp-btn B" data-brig="B">B</button>
    <button class="bp-btn C" data-brig="C">C</button>
    <button class="bp-btn D" data-brig="D">D</button>
  </div>

  <div class="clock" id="clock">--<span class="sep">:</span>--</div>
  <div class="date-info" id="dateInfo"></div>

  <div class="current-shift" id="currentShift"></div>

  <div class="mini-cal-wrap">
    <div class="mini-cal-month" id="miniCalMonth"></div>
    <div class="mini-cal" id="miniCal"></div>
  </div>

  <div class="footer">🏭 GRAFIK ZMIAN GILLETTE POLAND 2026</div>

<script>
/* === DANE (skrócone - wklejasz swoje pełne z głównego pliku) === */
const schedule = {
  1: {
    A: ['','N','N','','','','P','P','','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R','R'],
    B: ['','','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N'],
    C: ['','','','N','N','','','','P','P','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','P',''],
    D: ['','','R','R','R','','N','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','','P']
  },
  2: { A: ['','N','N','N','N','','','','P','P','','R','R','R','R','','N','N','N','N','N','','','P','P','P','P',''], B: ['N','','','P','P','P','','','','','P','P','P','P','','R','R','R','R','R','','N','N','N','N','','','P'], C: ['R','R','R','R','','','','','R','R','R','','N','N','N','N','','','','P','P','P','P','','R','R','R','R'], D: ['P','P','P','','R','R','','','N','N','N','N','','','P','P','P','P','P','','R','R','R','R','','N','N','N'] },
  3: { A: ['R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R','R','','N','N','N','N','','','P','P','P'], B: ['P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','P','','R','R','R','R','','N','N','N','N',''], C: ['','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','N','','','P','P','P','P','','R','R'], D: ['N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','','P','P','P','P','','R','R','R','R','','N'] },
  4: { A: ['P','P','','','','','','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','P'], B: ['','','','','','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R','','','N','N'], C: ['R','R','','','','','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R'], D: ['N','','','','','','N','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','N','',''] },
  5: { A: ['','','','','P','P','','R','R','R','R','R','','N','N','N','N','','','P','P','P','P','','N','N','N','N','','','P'], B: ['','','','','N','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','','','','P','P','P','P',''], C: ['','','','','','','P','P','P','P','P','','R','R','R','R','','N','N','N','N','','','','R','R','R','','N','N','N'], D: ['','','','','R','R','R','','','N','N','N','N','','','P','P','P','P','','R','R','R','','P','P','','R','R','R','R'] },
  6: { A: ['P','P','P','','R','R','R','','N','N','N','N','','','P','P','P','P','','P','P','','R','R','R','R','','N','N',''], B: ['','R','R','','','','P','P','P','P','','R','R','R','R','','','P','','R','R','R','','N','N','N','N','','','R'], C: ['N','N','','','P','P','','R','R','R','R','','N','N','N','N','','P','','N','N','N','N','','','P','P','P','P',''], D: ['R','','','','N','N','N','N','','','P','P','P','P','','R','R','P','','','','P','P','P','P','','R','R','R',''] },
  7: { A: ['','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','','R','R','R','','N','N','N','N','','','P','P'], B: ['R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','','N','N','N','N','','','P','P','P','P','','R'], C: ['N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','','','','P','P','P','P','','R','R','R','R',''], D: ['P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','P','P','','R','R','R','R','','N','N','N','N'] },
  8: { A: ['P','P','','R','R','R','R','','N','N','N','N','','','','','R','R','R','','N','N','N','N','','','P','P','P','P',''], B: ['R','R','R','','N','N','N','N','','','P','P','P','P','','','N','N','N','N','','','P','P','P','P','','R','R','R','R'], C: ['N','N','N','N','','','P','P','P','P','','R','R','R','','','P','P','','R','R','R','R','','N','N','N','N','','','P'], D: ['','','P','P','P','P','','R','R','R','R','','N','N','','','','','P','P','P','P','','R','R','R','R','','N','N','N'] },
  9: { A: ['R','R','R','R','R','','N','N','N','N','','','P','P','P','','R','R','R','','N','N','N','N','','','P','P','P','P'], B: ['','N','N','N','N','N','','','P','P','P','P','','R','R','R','','','','','P','P','','R','R','R','R','','N','N'], C: ['P','P','P','P','','R','R','R','R','','N','N','N','N','','P','P','P','','','R','R','R','','N','N','N','N','',''], D: ['N','','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','','','P','P','P','P','','R','R','R'] },
  10: { A: ['','R','R','R','R','','','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','',''], B: ['N','N','','','P','P','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R',''], C: ['P','P','P','P','','R','R','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N',''], D: ['R','','N','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P','P',''] },
  11: { A: ['','P','P','','R','R','R','R','','','','R','R','R','','N','N','N','N','','','P','P','P','P','','R','R','R','R'], B: ['','','','P','P','P','P','','R','R','','P','P','','R','R','R','R','','N','N','N','N','','','P','P','P','P',''], C: ['','N','N','N','N','','','P','P','P','','','','P','P','P','P','','R','R','R','R','','N','N','N','N','','','P'], D: ['','R','R','R','','N','N','N','N','','','N','N','N','N','','','P','P','P','P','','R','R','R','R','','N','N','N'] },
  12: { A: ['','','N','N','N','N','','','P','P','P','P','','R','R','R','R','R','','N','N','N','','','','','P','P','P','P',''], B: ['R','R','R','R','R','','N','N','N','N','','','P','P','P','P','P','','R','R','R','','','','','','N','N','N','N',''], C: ['P','P','P','P','','R','R','R','R','','N','N','N','N','N','','','P','P','P','P','P','','','','','','','','',''], D: ['N','N','','','P','P','P','P','','R','R','R','R','','','N','N','N','N','','','R','R','','','','','R','R','R',''] }
};

const monthNames = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const dayNamesFull = ['Niedziela','Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'];
const shiftEmoji = { R: '🌅', P: '🌤️', N: '🌙', '': '🏖️' };
const shiftFullName = { R: 'Rano', P: 'Popołudnie', N: 'Noc', '': 'Wolne' };

/* Wybrana brygada — zapisujemy w localStorage */
let selectedBrigade = localStorage.getItem('screensaver_brigade') || 'A';

function isWolne(s) { return s === '' || s === null || s === undefined; }
function daysInMonth(m) { return schedule[m] && schedule[m].A.length; }
function getShiftAt(m, d, b) {
  if (!schedule[m] || !schedule[m][b]) return null;
  return schedule[m][b][d - 1];
}
function isUrlop(m, d, b) {
  try {
    const u = JSON.parse(localStorage.getItem('gillette_urlops_v1')) || {};
    const key = `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return u[b] && u[b].includes(key);
  } catch(e) { return false; }
}

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').innerHTML = `${h}<span class="sep">:</span>${m}`;

  const dow = dayNamesFull[now.getDay()];
  const day = now.getDate();
  const monName = monthNames[now.getMonth()];
  document.getElementById('dateInfo').textContent = `${dow}, ${day} ${monName} ${now.getFullYear()}`;
}

function updateCurrentShift() {
  const now = new Date();
  if (now.getFullYear() !== 2026) {
    document.getElementById('currentShift').innerHTML = `<div class="cs-labels"><div class="cs-name">Grafik dostępny tylko na 2026</div></div>`;
    return;
  }
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const onU = isUrlop(m, d, selectedBrigade);
  const shift = onU ? 'U' : (getShiftAt(m, d, selectedBrigade) || '');
  const shiftDisplay = onU ? '🌴' : (isWolne(shift) ? '—' : shift);
  const shiftName = onU ? 'URLOP' : (isWolne(shift) ? 'Wolne' : shiftFullName[shift]);

  let timeInfo = '';
  if (!onU && !isWolne(shift)) {
    const ranges = { R: '6:00 – 14:00', P: '14:00 – 22:00', N: '22:00 – 6:00' };
    timeInfo = `<div class="cs-time">${ranges[shift]}</div>`;
  }

  document.getElementById('currentShift').innerHTML = `
    <div class="cs-brigade ${selectedBrigade}">${selectedBrigade}</div>
    <div class="cs-shift ${onU ? 'U' : (isWolne(shift) ? 'W' : shift)}">${shiftDisplay}</div>
    <div class="cs-labels">
      <div class="cs-name">${shiftName}</div>
      ${timeInfo}
    </div>
  `;
}

function renderMiniCal() {
  const now = new Date();
  const y = 2026;
  const m = (now.getFullYear() === 2026) ? now.getMonth() + 1 : 1;
  document.getElementById('miniCalMonth').textContent = `${monthNames[m-1]} ${y} — Brygada ${selectedBrigade}`;

  const container = document.getElementById('miniCal');
  container.innerHTML = '';
  const dayHeaders = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
  dayHeaders.forEach((dn, i) => {
    const h = document.createElement('div');
    h.className = 'h' + (i>=5 ? ' we' : '');
    h.textContent = dn;
    container.appendChild(h);
  });

  const first = new Date(y, m-1, 1);
  let sd = first.getDay();
  sd = sd === 0 ? 6 : sd - 1;
  const dim = daysInMonth(m);

  for (let i = 0; i < sd; i++) {
    const e = document.createElement('div');
    e.className = 'd e';
    container.appendChild(e);
  }

  for (let d = 1; d <= dim; d++) {
    const s = getShiftAt(m, d, selectedBrigade);
    const onU = isUrlop(m, d, selectedBrigade);
    const cls = onU ? 'dU' : (isWolne(s) ? 'dW' : 'd' + s);
    const el = document.createElement('div');
    el.className = 'd ' + cls;
    el.textContent = d;
    if (now.getFullYear() === y && now.getMonth()+1 === m && now.getDate() === d) el.classList.add('today');
    container.appendChild(el);
  }
}

function updateAll() {
  updateClock();
  updateCurrentShift();
  renderMiniCal();
  updateBrigadeButtons();
}

function updateBrigadeButtons() {
  document.querySelectorAll('.bp-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.brig === selectedBrigade);
  });
}

document.querySelectorAll('.bp-btn').forEach(b => {
  b.addEventListener('click', () => {
    selectedBrigade = b.dataset.brig;
    localStorage.setItem('screensaver_brigade', selectedBrigade);
    updateAll();
  });
});

// Pełny ekran przy pierwszej interakcji
document.body.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
});

// Wyjście z screensavera przez ESC lub ruch myszy (opcjonalne)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') window.close();
});

updateAll();
setInterval(updateClock, 1000);
setInterval(updateCurrentShift, 60000);
setInterval(renderMiniCal, 60000);
</script>
</body>
</html>
