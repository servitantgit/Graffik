name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # GitHub Actions runners: Node 20 is deprecated; use 22 LTS or 24
          node-version: '22'

      - name: Show Node version
        run: node --version

      - name: Run unit tests
        # Unquoted glob so the shell expands to real files (more reliable than a quoted pattern)
        run: node --test --test-reporter=spec tests/*.test.js
