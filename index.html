<!-- FLOATING EDIT PALETTE -->
<div class="edit-palette" id="editPalette">
  <button class="palette-btn p-R" data-shift="R" data-i18n-title="paletteTitleR" title="Rano (R)">
    R<span class="pb-hotkey">R</span>
  </button>
  <button
    class="palette-btn p-P"
    data-shift="P"
    data-i18n-title="paletteTitleP"
    title="Popołudnie (P)"
  >
    P<span class="pb-hotkey">P</span>
  </button>
  <button class="palette-btn p-N" data-shift="N" data-i18n-title="paletteTitleN" title="Noc (N)">
    N<span class="pb-hotkey">N</span>
  </button>
  <button class="palette-btn p-W" data-shift="" data-i18n-title="paletteTitleW" title="Wolne (W)">
    —<span class="pb-hotkey">W</span>
  </button>
  <button
    class="palette-btn p-CYCLE active"
    data-shift="CYCLE"
    data-i18n-title="cycleMode"
    title="Cykl"
  >
    🔄<span class="pb-hotkey">C</span>
  </button>
</div>
